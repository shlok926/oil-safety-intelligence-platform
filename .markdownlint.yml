# Markdownlint configuration
# Kept deliberately lenient: these are large, table/diagram-heavy technical
# documents, and overly strict style rules produce noise rather than value.

default: true

# Allow long lines (tables, Mermaid diagrams, and code blocks routinely exceed 80 chars)
MD013: false

# Allow inline HTML (used for badges/centered headers in README.md)
MD033: false

# Allow duplicate headings across different documents (e.g. every doc has a "## 1. Overview")
MD024:
  siblings_only: true

# Allow multiple top-level headings is fine for our doc style
MD025: false

# Don't require a single trailing newline style enforcement to fail the build
MD047: false

# Bare URLs are acceptable in reference-heavy technical docs
MD034: false
