services:
  postgres:
    image: postgres:16-alpine
    container_name: oil_safety_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oil_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_secure_password_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-oil_safety_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oil_admin} -d ${POSTGRES_DB:-oil_safety_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oil_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: oil_safety_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      APP_NAME: ${APP_NAME:-OIL Safety Intelligence Platform}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_USER: ${POSTGRES_USER:-oil_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_secure_password_dev_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-oil_safety_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oil_admin}:${POSTGRES_PASSWORD:-oil_secure_password_dev_only}@postgres:5432/${POSTGRES_DB:-oil_safety_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/app/models/cache}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - model_cache:/app/models/cache
    networks:
      - oil_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: oil_safety_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - oil_network

volumes:
  postgres_data:
    driver: local
  model_cache:
    driver: local

networks:
  oil_network:
    driver: bridge
